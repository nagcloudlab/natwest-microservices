# ============================================================
# SHARED DOCKER OVERRIDES — Applies to ALL services when profile=docker
# ============================================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
spring.kafka.bootstrap-servers=kafka:9092

# JWT — Override jwk-set-uri for Docker network (keycloak:8080 instead of localhost:8180)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/ftgo/protocol/openid-connect/certs
