# ============================================================
# SHARED CONFIG — Applies to ALL services fetching from config-server
# ============================================================

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# H2 defaults
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA defaults
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka defaults (ignored by services without spring-kafka on classpath)
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Actuator — expose health and Prometheus endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ============================================================
# JWT — Keycloak JWKS for local dev (shared by all services)
# Using jwk-set-uri (not issuer-uri) so signature validation works
# without issuer mismatch issues across environments.
# ============================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/ftgo/protocol/openid-connect/certs
