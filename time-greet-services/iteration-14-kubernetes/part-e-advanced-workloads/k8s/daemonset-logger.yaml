apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  namespace: demo
  labels:
    app: node-logger
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date) — Node logger running on $(hostname)"
                sleep 30
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
