apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check
  namespace: demo
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: health-check
              image: curlimages/curl:8.5.0
              command:
                - sh
                - -c
                - |
                  echo "=== Health Check $(date) ==="
                  echo "Greeting Service:"
                  curl -sf http://greeting-service:9001/actuator/health && echo " OK" || echo " FAIL"
                  echo "Time Service:"
                  curl -sf http://time-service:9002/actuator/health && echo " OK" || echo " FAIL"
          restartPolicy: OnFailure
