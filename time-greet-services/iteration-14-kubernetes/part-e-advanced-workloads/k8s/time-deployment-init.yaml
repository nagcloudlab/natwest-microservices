apiVersion: apps/v1
kind: Deployment
metadata:
  name: time-service-with-init
  namespace: demo
  labels:
    app: time-service-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: time-service-init
  template:
    metadata:
      labels:
        app: time-service-init
    spec:
      initContainers:
        - name: wait-for-greeting
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for greeting-service DNS to resolve..."
              until nslookup greeting-service.demo.svc.cluster.local; do
                echo "greeting-service not ready — sleeping 2s"
                sleep 2
              done
              echo "greeting-service is available!"
      containers:
        - name: time-service
          image: time-service:1.0.0
          ports:
            - containerPort: 9002
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9002
            initialDelaySeconds: 15
            periodSeconds: 5
