openapi: 3.0.3
info:
  title: Time Service API (Contract-First)
  description: >
    Contract-first API spec. The openapi-generator-maven-plugin generates
    a Java interface (CombinedApi) from this file. TimeController implements
    that interface so the compiler enforces the contract.
  version: 1.0.0
  contact:
    name: NatWest Training

paths:
  /api/v1/combined:
    get:
      operationId: getCombined
      summary: Combined time + greeting
      description: >
        Returns the current server time together with a greeting fetched
        from the greeting-service. Demonstrates contract-first development.
      tags:
        - Combined
      responses:
        '200':
          description: Combined response returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedResponse'
        '503':
          description: Greeting service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    CombinedResponse:
      type: object
      required:
        - time
        - greeting
        - host
      properties:
        time:
          type: string
          format: date-time
          description: Current server time in ISO-8601
          example: "2024-01-15T10:30:00Z"
        greeting:
          type: string
          description: Greeting message from greeting-service
          example: "Hello, World!"
        host:
          type: string
          description: Hostname of the time-service instance
          example: "time-service-abc123"
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
