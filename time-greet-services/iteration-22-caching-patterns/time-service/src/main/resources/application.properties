spring.application.name=time-service
server.port=9002
spring.mvc.problemdetails.enabled=true
greeting.service.url=http://localhost:9001

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Actuator: expose health, metrics, prometheus and caches ---
management.endpoints.web.exposure.include=health,metrics,prometheus,caches
management.endpoint.health.show-details=always

# --- Distributed tracing: sample every request ---
management.tracing.sampling.probability=1.0
