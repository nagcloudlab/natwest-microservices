apiVersion: 1

groups:
  - orgId: 1
    name: rate-limit-alerts
    folder: Rate Limiting
    interval: 10s
    rules:
      - uid: rate-limit-429
        title: Rate Limit 429 Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: rate(http_server_requests_seconds_count{status="429"}[1m])
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: "Rate limiter is returning 429 responses"
          description: "greeting-service is rejecting requests due to rate limiting"
        labels:
          severity: warning
