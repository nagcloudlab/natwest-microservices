# ============================================================
# API GATEWAY DOCKER OVERRIDES
# ============================================================

# OAuth2 client — Docker override for Keycloak URL
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/ftgo

# CORS — Allow ftgo-web container (Docker internal)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://ftgo-web:3000
