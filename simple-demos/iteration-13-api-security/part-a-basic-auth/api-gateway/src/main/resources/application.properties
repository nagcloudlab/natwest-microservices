spring.application.name=api-gateway
server.port=9000

# Routes — direct URLs (no Eureka)
spring.cloud.gateway.routes[0].id=greeting-service
spring.cloud.gateway.routes[0].uri=http://localhost:9001
spring.cloud.gateway.routes[0].predicates[0]=Path=/greeting,/greeting/**

spring.cloud.gateway.routes[1].id=time-service
spring.cloud.gateway.routes[1].uri=http://localhost:9002
spring.cloud.gateway.routes[1].predicates[0]=Path=/time,/time/**

management.endpoints.web.exposure.include=health
