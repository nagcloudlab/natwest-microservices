services:

  # ============================================================
  # GREETING SERVICE — HTTPS:9001, mTLS required
  # ============================================================
  greeting-service:
    build: ./greeting-service
    ports:
      - "9001:9001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:9011/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # TIME SERVICE — HTTPS:9002, mTLS required, mTLS client to greeting
  # ============================================================
  time-service:
    build: ./time-service
    ports:
      - "9002:9002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      greeting-service:
        condition: service_healthy
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:9012/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # API GATEWAY — HTTPS:9000, mTLS client to downstream
  # ============================================================
  api-gateway:
    build: ./api-gateway
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      greeting-service:
        condition: service_healthy
      time-service:
        condition: service_healthy
