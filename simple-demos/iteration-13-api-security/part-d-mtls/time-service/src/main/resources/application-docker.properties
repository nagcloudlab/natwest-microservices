# TLS server config
server.ssl.enabled=true
server.ssl.key-store=/app/certs/time-service.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=time-service

# mTLS: require client certificate
server.ssl.client-auth=need
server.ssl.trust-store=/app/certs/truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12

# mTLS client config (for calling greeting-service)
mtls.keystore.path=/app/certs/time-service.p12
mtls.keystore.password=changeit
mtls.truststore.path=/app/certs/truststore.p12
mtls.truststore.password=changeit

greeting.service.url=https://greeting-service:9001

# Actuator on separate non-SSL port for health checks
management.server.port=9012
management.server.ssl.enabled=false
