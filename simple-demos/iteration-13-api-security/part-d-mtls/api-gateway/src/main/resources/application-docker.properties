# Gateway TLS server config (HTTPS on port 9000)
server.ssl.enabled=true
server.ssl.key-store=/app/certs/api-gateway.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=api-gateway

# Gateway as mTLS client to downstream services
spring.cloud.gateway.httpclient.ssl.key-store=/app/certs/api-gateway.p12
spring.cloud.gateway.httpclient.ssl.key-store-password=changeit
spring.cloud.gateway.httpclient.ssl.key-store-type=PKCS12
spring.cloud.gateway.httpclient.ssl.trusted-x509-certificates[0]=/app/certs/ca.pem
spring.cloud.gateway.httpclient.ssl.use-insecure-trust-manager=false

# Full route definitions (Spring binds routes as a list)
spring.cloud.gateway.routes[0].id=greeting-service
spring.cloud.gateway.routes[0].uri=https://greeting-service:9001
spring.cloud.gateway.routes[0].predicates[0]=Path=/greeting,/greeting/**

spring.cloud.gateway.routes[1].id=time-service
spring.cloud.gateway.routes[1].uri=https://time-service:9002
spring.cloud.gateway.routes[1].predicates[0]=Path=/time,/time/**

# Actuator on separate non-SSL port for health checks
management.server.port=9010
management.server.ssl.enabled=false
