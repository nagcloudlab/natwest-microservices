# Use jwk-set-uri instead of issuer-uri to avoid issuer mismatch
# (token is issued as localhost:8180 but services see keycloak:8080)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/demo/protocol/openid-connect/certs

spring.cloud.gateway.routes[0].id=greeting-service
spring.cloud.gateway.routes[0].uri=http://greeting-service:9001
spring.cloud.gateway.routes[0].predicates[0]=Path=/greeting,/greeting/**
spring.cloud.gateway.routes[0].filters[0]=TokenRelay

spring.cloud.gateway.routes[1].id=time-service
spring.cloud.gateway.routes[1].uri=http://time-service:9002
spring.cloud.gateway.routes[1].predicates[0]=Path=/time,/time/**
spring.cloud.gateway.routes[1].filters[0]=TokenRelay
