spring.application.name=api-gateway
server.port=9000

# OAuth2 Resource Server — validate JWT via Keycloak JWKS
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/demo

# Routes with TokenRelay filter (forwards JWT to downstream services)
spring.cloud.gateway.routes[0].id=greeting-service
spring.cloud.gateway.routes[0].uri=http://localhost:9001
spring.cloud.gateway.routes[0].predicates[0]=Path=/greeting,/greeting/**
spring.cloud.gateway.routes[0].filters[0]=TokenRelay

spring.cloud.gateway.routes[1].id=time-service
spring.cloud.gateway.routes[1].uri=http://localhost:9002
spring.cloud.gateway.routes[1].predicates[0]=Path=/time,/time/**
spring.cloud.gateway.routes[1].filters[0]=TokenRelay

management.endpoints.web.exposure.include=health
