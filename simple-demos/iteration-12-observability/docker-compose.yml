services:

  # ============================================================
  # EUREKA SERVER — Service Registry (port 8761)
  # ============================================================
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:8761/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # CONFIG SERVER — Centralized Configuration (port 8888)
  # Starts AFTER Eureka so it can register itself
  # ============================================================
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:8888/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # GREETING SERVICE — port 9001 (instrumented with OTEL agent)
  # ============================================================
  greeting-service:
    build: ./greeting-service
    ports:
      - "9001:9001"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: greeting-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    depends_on:
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:9001/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # TIME SERVICE — port 9002 (instrumented with OTEL agent)
  # ============================================================
  time-service:
    build: ./time-service
    ports:
      - "9002:9002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: time-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    depends_on:
      config-server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:9002/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # API GATEWAY — port 9000 (instrumented with OTEL agent)
  # ============================================================
  api-gateway:
    build: ./api-gateway
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
    depends_on:
      config-server:
        condition: service_healthy
      greeting-service:
        condition: service_healthy
      time-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  # ============================================================
  # OTEL COLLECTOR — Receives telemetry, exports to backends
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    depends_on:
      - tempo
      - loki

  # ============================================================
  # TEMPO — Distributed Trace Storage (port 3200)
  # ============================================================
  tempo:
    image: grafana/tempo:2.6.1
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"

  # ============================================================
  # LOKI — Log Aggregation (port 3100)
  # ============================================================
  loki:
    image: grafana/loki:3.3.2
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"

  # ============================================================
  # PROMETHEUS — Metrics Storage (port 9090)
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # ============================================================
  # GRAFANA — Observability Dashboard (port 3001)
  # ============================================================
  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3001:3000"
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
